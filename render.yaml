services:
  # Django Web Server
  - type: web
    name: royal-barber-web
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: PAYMENT_PROVIDER_TOKEN
        sync: false
      - key: EXTERNAL_WEBSITE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

  # Telegram Bot (Background Worker - 24/7)
  - type: worker
    name: royal-barber-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_bot.py"
    envVars:
      - key: SECRET_KEY
        fromService:
          name: royal-barber-web
          type: web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: PAYMENT_PROVIDER_TOKEN
        sync: false
      - key: EXTERNAL_WEBSITE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
